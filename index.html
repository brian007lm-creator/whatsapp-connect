<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Conectar WhatsApp - EspartaFit</title>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 100px;">
  <h2>Conectar WhatsApp Business (Coexistencia)</h2>
  <button onclick="launchWhatsAppSignup()" style="padding: 15px 30px; font-size: 16px; background: #25D366; color: white; border: none; border-radius: 8px; cursor: pointer;">
    Conectar WhatsApp
  </button>
  <p id="resultado" style="margin-top: 20px; color: #555;"></p>

  <script>
    window.fbAsyncInit = function() {
      FB.init({ appId: '2427876134366601', autoLogAppEvents: true, xfbml: true, version: 'v21.0' });
    };
  </script>
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/es_LA/sdk.js"></script>
  <script>
    function launchWhatsAppSignup() {
      FB.login(function(response) {
        document.getElementById('resultado').innerText = JSON.stringify(response, null, 2);
        console.log('Respuesta completa:', response);
      }, {
        config_id: '1822372225594874',
        response_type: 'code',
        override_default_response_type: true,
        extras: { featureType: 'whatsapp_business_app_onboarding', sessionInfoVersion: '3' }
      });
    }
  </script>
</body>
</html>
